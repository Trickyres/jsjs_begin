<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>高德地理编码Promise封装</title>
<!-- 1.引入高德JS‑API，这里key替换成你自己申请的高德web端key -->
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=c143056e5073b281c92ff409cd43605b"></script>
<style>
#container {
  width: 100%;
  height: 120px;
  border:1px solid #ccc;
  padding:8px;
  box-sizing: border-box;
}
#result {
  width: 100%;
  min-height: 220px;
  border:1px solid #ccc;
  padding:8px;
  box-sizing: border-box;
  margin-top:10px;
  white-space: pre-wrap;
}
input {
  padding:4px;
  font-size:14px;
}
button {
  padding:4px 12px;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="container"> 状态信息 </div>
<br>
<input type="text" id="address"  style="width: 300px;" placeholder="请输入地址，例如：上海市南京东路">
<button id="btn">查询</button>
<div id="result"> 结果展示 </div>

<script>
// DOM元素
const addressInput = document.getElementById('address');
const btn = document.getElementById('btn');
const containerDom = document.getElementById('container');
const resultDom = document.getElementById('result');

/**
 * 地理编码：地址转经纬度
 * @param {string} addressText 地址文本
 * @param {string} city 城市默认上海
 * @returns {Promise<Object|null>}
 */
function getGeoByAddress(addressText, city = "上海") {
  return new Promise((resolve) => {
    // 加载地理编码插件
    AMap.plugin("AMap.Geocoder", function () {
      const geocoder = new AMap.Geocoder({ city: city });
      geocoder.getLocation(addressText, function (status, result) {
        if (status === "complete" && result.info === "OK" && result.geocodes?.length > 0) {
          resolve(result);
        } else {
          resolve(null);
        }
      })
    })
  })
}

/**
 * 渲染结果到页面
 * @param {string} addr 输入地址
 * @param {Object|null} res 地理编码返回结果
 */
function renderResult(addr, res) {
  if(!res) {
    resultDom.innerText = `【地址】${addr}\n👉地址解析失败，未找到匹配地理信息`;
    return;
  }
  const geoItem = res.geocodes[0];
  const location = geoItem.location;
  resultDom.innerText =
`【原始输入地址】：${addr}
【格式化地址】：${geoItem.formatted_address}
【经度lng】：${location.lng}
【纬度lat】：${location.lat}
【城市】：${geoItem.city}
【行政区】：${geoItem.district}
【级别】：${geoItem.level}`;
}

// 高德SDK就绪事件（官方推荐，优先于window.onload）
AMap.onload = async function () {
  containerDom.innerText = "✅高德地图SDK加载完成，准备就绪";
  // 页面初始化默认查询：上海市南京东路
  const initAddr = "上海市南京东路";
  try {
    const res = await getGeoByAddress(initAddr);
    renderResult(initAddr, res);
  } catch (err) {
    containerDom.innerText = "❌初始化查询异常：" + err.message;
  }

  // 按钮点击查询
  btn.addEventListener('click', async ()=>{
    const inputVal = addressInput.value.trim();
    if(!inputVal) {
      resultDom.innerText = "⚠️请输入有效地址！";
      return;
    }
    containerDom.innerText = "🔍正在解析地址：" + inputVal;
    const res = await getGeoByAddress(inputVal);
    renderResult(inputVal, res);
    containerDom.innerText = "✅查询完成";
  })
}

// 监听SDK加载失败
AMap.onerror = function(){
  containerDom.innerText = "❌高德地图SDK加载失败，请检查key或者网络";
}
</script>
</body>
</html>
