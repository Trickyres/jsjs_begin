<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>稼享指南｜多稼十分钟生活圈</title>
  <link rel="stylesheet" href="index_renew.css">
</head>
<body>
  <!--
    ==============================
    二、HTML 页面结构区
    ==============================
    HTML 负责“页面有哪些东西”。

    本页面是一个单页 H5：
    1. data-view="home"  首页
    2. data-view="map"   地图页
    3. data-view="list"  点位列表页
    4. data-view="phone" 便民电话页
    5. nav.bottom-nav 固定底部导航栏
    main.app管理整个应用
    section.view 管理每个页面视图
    div card button 管理等元素构成页面内容

    这些 section 同时存在，但一次只显示一个。
    JS 会给当前页面加 active 类，其余页面隐藏。
    street-illustration 是hero的背景图
  -->
  <main class="app" id="app">
    <!-- 首页：标题、导语、快捷入口、本周推荐 -->
    <section class="view active" data-view="home">
      <div class="hero">
        <h1>稼享指南</h1>
        <h2>多稼十分钟生活圈服务地图</h2>
        <p>从家门口出发，发现身边的服务、生活与社区记忆。</p>
        <div class="hero-badge">小东门街道</div>
        <div class="bird one"></div>
        <div class="bird two"></div>
        <div class="street-illustration" aria-hidden="true"> 
          <div class="gate"></div>
          <div class="building b1"></div>
          <div class="building b2"></div>
          <div class="building b3"></div>
          <div class="tree"></div>
          <div class="road"></div>
        </div>
      </div>

      <div class="quick-card" id="quickEntries"></div>

      <div class="section-head">
        <div class="section-title">稼园推荐</div>
        <button class="more-btn" data-go="list">更多路线 ›</button>
      </div>

      <article class="recommend-card" data-select-point="huangpu-riverside">
        <div class="thumb-river"></div>
        <div class="recommend-content">
          <h3>滨江散步路线 <span class="tag leisure">休闲游玩</span></h3>
          <p>沿江步道，风景宜人，适合散步与亲子时光。</p>
          <div class="meta"><span>◷ 约40分钟</span><span>⌖ 1.8公里</span></div>
        </div>
      </article>

      <article class="route-card" data-go="list">
        <h3>新居民熟悉路线</h3>
        <p>社区服务一站式指南，快速熟悉居委、卫生、药房与生活配套。</p>
        <button class="btn btn-mini btn-primary">去看看</button>
      </article>
    </section>

    <!-- 地图页：分类筛选、示意地图、底部点位卡片 -->
    <section class="view" data-view="map">
      <div class="topbar">
        <button class="back-btn" data-go="home" aria-label="返回">‹</button>
        <div class="topbar-title">生活地图</div>
        <button class="icon-btn" id="mapTipBtn" aria-label="说明">•••</button>
      </div>

      <div class="pill-row" id="mapFilters"></div>

      <div class="map-shell">
        <!-- <div class="map-canvas" id="mapCanvas">
          <div class="river"></div>
          <div class="park"></div>
          <div class="park two"></div>
          <span class="map-label" style="left:54%;top:10%;transform:rotate(-8deg);">小东门街区</span>
          <span class="map-label" style="left:40%;top:22%;">东门小学</span>
          <span class="map-label" style="left:66%;top:26%;transform:rotate(-20deg);">滨江步道</span>
          <span class="map-label" style="left:63%;top:46%;">社区广场</span>
          <span class="map-label" style="left:18%;top:56%;transform:rotate(76deg);">中山南路</span>
          <span class="map-label" style="left:52%;top:62%;transform:rotate(64deg);">东新路</span>
        </div> -->
        <div class="real-design-map" id="duojiaMap" aria-label="多稼生活地图">
          <img src="./assets/duojia-map-bg.webp" alt="稼享指南多稼生活地图">
        </div>
        <button class="locate-btn" id="locateBtn" aria-label="回到中心" hidden>⌖</button>
        <div class="sheet" id="mapSheet"></div>
      </div>

      <section class="map-calibrator" id="mapCalibrator" hidden aria-label="地图点位校准工具">
        <h3>🛠 地图点位校准模式</h3>
        <p>选择地点后直接拖动圆圈；也可以修改 X、Y 和点击范围。调整结果会暂存在本浏览器中。</p>
        <select class="calibration-select" id="calibrationPointSelect" aria-label="选择需要校准的地点"></select>
        <div class="calibration-fields">
          <label>X（左右）<input id="calibrationX" type="number" min="0" max="100" step="0.1"></label>
          <label>Y（上下）<input id="calibrationY" type="number" min="0" max="100" step="0.1"></label>
          <label>范围 px<input id="calibrationSize" type="number" min="20" max="80" step="2"></label>
        </div>
        <div class="calibration-actions">
          <button class="btn btn-ghost" id="calibrationPrevBtn" type="button">← 上一个</button>
          <button class="btn btn-ghost" id="calibrationNextBtn" type="button">下一个 →</button>
          <button class="btn btn-primary" id="copyCurrentPointBtn" type="button">复制当前点</button>
          <button class="btn btn-primary" id="copyAllPointsBtn" type="button">复制全部点位</button>
          <button class="btn btn-ghost" id="resetCalibrationBtn" type="button">恢复源文件坐标</button>
        </div>
        <textarea class="calibration-output" id="calibrationOutput" readonly aria-label="校准数据输出"></textarea>
      </section>
    </section>

    <!-- 点位列表页：搜索框、分类筛选、点位卡片列表 -->
    <section class="view" data-view="list">
      <div class="topbar">
        <button class="back-btn" data-go="home" aria-label="返回">‹</button>
        <div class="topbar-title" id="listTitle">便民服务</div>
        <button class="icon-btn" id="listTipBtn" aria-label="说明">•••</button>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜索药房、菜场、居委会…" autocomplete="off" />
      </div>
      <div class="pill-row" id="listFilters"></div>
      <div class="list" id="placeList"></div>
    </section>

    <!-- 便民电话页：常用联系人和一键拨号 -->
    <section class="view" data-view="phone">
      <div class="topbar">
        <button class="back-btn" data-go="home" aria-label="返回">‹</button>
        <div class="topbar-title">便民电话</div>
        <button class="icon-btn" aria-label="说明" aria-hidden="true" tabindex="-1" style="visibility: hidden; pointer-events: none;">•••</button>
      </div>
      <div class="section-head" style="margin-top:6px;">
        <div class="section-title">常用联系</div>
      </div>
      <div class="list" id="contactList"></div>
    </section>

    <!-- 底部导航：点击按钮后，JS 根据 data-go 切换页面 -->
    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" data-go="home"><span class="nav-icon">⌂</span><span>首页</span></button>
      <button class="nav-item" data-go="map"><span class="nav-icon">⌖</span><span>地图</span></button>
      <button class="nav-item" data-go="phone"><span class="nav-icon">☎</span><span>电话</span></button>
      <button class="nav-item" id="aboutBtn"><span class="nav-icon">♡</span><span>我的</span></button>
    </nav>

    <div class="toast" id="toast"></div>
  </main>

  <script src="index_renew.js"></script>
</body>
</html>
