<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026 年 10 月社区活动海报审核稿</title>
  <script>document.documentElement.dataset.event = new URLSearchParams(location.search).get('event') === 'osmanthus' ? 'osmanthus' : 'plant';</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; }
    body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #37281e; }
    .poster { width: 1080px; height: 1440px; position: relative; overflow: hidden; background-size: cover; background-position: center; }
    #plant { background-image: url('./plant-background.png'); }
    #osmanthus { background-image: url('./osmanthus-background.png'); }
    html[data-event="plant"] #osmanthus, html[data-event="osmanthus"] #plant { display: none; }
    .poster::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,250,239,.40) 0%, rgba(255,250,239,.23) 42%, transparent 58%); pointer-events: none; }
    .border { position: absolute; inset: 33px; border: 2px solid rgba(136,105,73,.32); border-radius: 32px; pointer-events: none; }
    .topline { position: absolute; left: 88px; right: 88px; top: 83px; display: flex; align-items: center; justify-content: space-between; }
    .brand { color: #a54725; font-size: 27px; font-weight: 800; letter-spacing: 4px; }
    .series { font-size: 21px; letter-spacing: 4px; font-weight: 700; color: #867667; }
    .kicker { position: absolute; top: 202px; left: 88px; display: inline-flex; align-items: center; gap: 13px; color: #668d56; font-size: 28px; font-weight: 800; letter-spacing: 5px; }
    .kicker::before { content: ""; width: 35px; height: 3px; background: currentColor; }
    h1 { position: absolute; left: 88px; top: 252px; margin: 0; width: 890px; color: #37281e; font-size: 94px; line-height: 1.18; letter-spacing: 3px; font-weight: 900; text-shadow: 0 2px 1px rgba(255,255,255,.35); }
    .tagline { position: absolute; left: 91px; top: 515px; font-size: 30px; line-height: 1.5; letter-spacing: 2px; font-weight: 600; color: #735b48; }
    .date { position: absolute; left: 88px; top: 599px; border-radius: 100px; background: #c7431f; color: #fffdf8; padding: 17px 28px; display: flex; align-items: center; gap: 18px; box-shadow: 0 10px 28px rgba(110,46,20,.20); }
    .date b { font-size: 30px; letter-spacing: 2px; }
    .date span { font-size: 25px; font-weight: 700; opacity: .93; }
    .footer { position: absolute; bottom: 76px; left: 72px; right: 72px; min-height: 134px; border-radius: 29px; background: rgba(255,253,248,.92); box-shadow: 0 10px 40px rgba(63,45,25,.14); display: flex; align-items: center; justify-content: space-between; padding: 24px 31px 24px 39px; }
    .footer-title { color: #a94625; font-size: 33px; font-weight: 900; letter-spacing: 2px; }
    .footer-note { margin-top: 7px; color: #806f61; font-size: 22px; letter-spacing: 1px; }
    .arrow { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: #c7431f; color: #fff; font-size: 43px; font-weight: 700; line-height: 1; }
    #osmanthus .kicker { color: #ae6e21; }
    #osmanthus h1 { top: 273px; font-size: 76px; line-height: 1.26; width: 914px; }
    #osmanthus .tagline { top: 515px; }
    #osmanthus .date { top: 604px; }
    #osmanthus .footer-title, #osmanthus .brand { color: #ad5c24; }
    #osmanthus .date, #osmanthus .arrow { background: #b6602a; }
  </style>
</head>
<body>
  <main class="poster" id="plant" aria-label="白领绿植手工活动海报">
    <div class="border"></div>
    <div class="topline"><div class="brand">稼享指南</div><div class="series">多稼 · 社区活动</div></div>
    <div class="kicker">秋日绿色小确幸</div>
    <h1>白领绿植<br>手工活动</h1>
    <div class="tagline">给忙碌的日常，添一抹绿意。</div>
    <div class="date"><b>2026.10.13</b><span>星期二</span></div>
    <div class="footer"><div><div class="footer-title">欢迎报名参与</div><div class="footer-note">具体时间、地点以活动通知为准</div></div><div class="arrow">›</div></div>
  </main>
  <main class="poster" id="osmanthus" aria-label="金桂节暨重阳敬老主题活动海报">
    <div class="border"></div>
    <div class="topline"><div class="brand">稼享指南</div><div class="series">多稼 · 社区活动</div></div>
    <div class="kicker">金秋邻里相聚</div>
    <h1>金桂节暨<br>重阳敬老主题活动</h1>
    <div class="tagline">桂香满邻里，敬老暖人心。</div>
    <div class="date"><b>2026.10.27</b><span>星期二</span></div>
    <div class="footer"><div><div class="footer-title">欢迎报名参与</div><div class="footer-note">具体时间、地点以活动通知为准</div></div><div class="arrow">›</div></div>
  </main>
</body>
</html>
